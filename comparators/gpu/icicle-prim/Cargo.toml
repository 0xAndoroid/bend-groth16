[package]
name = "icicle-prim"
version = "0.1.0"
edition = "2021"
publish = false

# open-icicle v4.0.0 checkout, reached through the gitignored symlink `open-icicle` in this directory:
#   ln -sfn "$DEV/open-icicle" comparators/gpu/icicle-prim/open-icicle
# (comparators/box/build.sh does this). See ../README.md and docs/box.md.
[dependencies]
icicle-bn254 = { path = "open-icicle/wrappers/rust/icicle-curves/icicle-bn254", default-features = false, features = ["msm", "ntt"] }
icicle-core = { path = "open-icicle/wrappers/rust/icicle-core" }
icicle-runtime = { path = "open-icicle/wrappers/rust/icicle-runtime" }
serde_json = "1"

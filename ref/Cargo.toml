[package]
name = "groth16-ref"
version = "0.1.0"
edition = "2021"
description = "arkworks reference harness for the bend-groth16 benchmark (BN254 SquareChain)"
publish = false

[[bin]]
name = "groth16-ref"
path = "src/main.rs"

[dependencies]
ark-bn254 = "0.5"
ark-ec = { version = "0.5", features = ["parallel"] }
ark-ff = { version = "0.5", features = ["parallel"] }
ark-poly = { version = "0.5", features = ["parallel"] }
ark-std = { version = "0.5", features = ["parallel"] }
ark-relations = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["parallel"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
